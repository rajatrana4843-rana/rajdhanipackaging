<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <meta name="robots" content="noindex">
    <script>
        var oldMap = {"detergent-powder-packaging":"detergent-powder-pouch-manufacturer"};
        var value = new URLSearchParams(window.location.search).get("category");
        value = oldMap[value] || value;
        window.location.replace(
            value && /^[a-z0-9-]+$/.test(value) ? "/product-category/" + value + "/" : "/shop/"
        );
    </script>
</head>
<body>
    <a href="/shop/">https://www.plasticpouchandbags.com/shop/</a>
</body>
</html>
